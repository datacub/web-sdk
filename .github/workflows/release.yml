name: Release

# On every push to main:
# 1. release-please opens a release pull request (version bump + CHANGELOG from conventional
#    commits) and merges it at once, which tags the version and creates the GitHub release.
# 2. If npm lacks package.json's version, build re-runs every check and packs the tarball, and
#    publish uploads it with provenance (no dependency code runs with publish rights), then installs
#    it from npm to verify.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      # No waiting on a person: merge the release PR, then run release-please again to tag and release.
      # (A merge made with GITHUB_TOKEN starts no new workflow run, so this run carries on to publish.)
      - if: steps.rp.outputs.prs_created == 'true'
        run: gh pr merge "$(echo "$PR" | jq -r .number)" --squash --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.rp.outputs.pr }}
      - if: steps.rp.outputs.prs_created == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      name: ${{ steps.state.outputs.name }}
      version: ${{ steps.state.outputs.version }}
      publish: ${{ steps.state.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # includes a release PR merged above
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: state
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then publish=false; else publish=true; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "$name@$version publish=$publish"
      - if: steps.state.outputs.publish == 'true'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run lint && bun run typecheck && bun run test && bun run pack:check
          mv "$(npm pack --ignore-scripts --silent | tail -1)" package.tgz
      - if: steps.state.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package.tgz
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    env:
      NAME: ${{ needs.build.outputs.name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Publish
        run: |
          npm install -g npm@12.2.3
          case "$VERSION" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish ./package.tgz --provenance --access public --tag "$tag"
        env:
          # Only until npm trusted publishing is set up for the package; then delete the secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify the published package installs
        run: |
          for i in 1 2 3 4 5 6; do npm view "$NAME@$VERSION" version && break; sleep 10; done
          cd "$(mktemp -d)" && npm init -y >/dev/null
          npm install --ignore-scripts --no-audit "$NAME@$VERSION"
          npm audit signatures
